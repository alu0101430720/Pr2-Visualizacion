# ══════════════════════════════════════════════════════════════════════════════
# plot_config.yaml — Configuración dinámica de assets gráficos
# ══════════════════════════════════════════════════════════════════════════════

# ── Paleta global ─────────────────────────────────────────────────────────────
paleta:
  # Colores principales (cualquier código hexadecimal válido entre comillas):
  color_hombres: "#4A90D9"
  color_mujeres: "#D94A8C"
  color_brecha_favorable_hombres: "#4A90D9"
  color_brecha_favorable_mujeres: "#D94A8C"
  
  # cmap_brecha: Si se omite, se usa el cmap personalizado azul→blanco→rosa.
  # Opciones: Cualquier colormap válido de matplotlib (ej. "RdBu_r", "bwr", "coolwarm", "PRGn")
  # cmap_brecha: "RdBu_r"

# Colores de las islas: personalización de la identidad visual de cada isla
colores_islas:
  # Claves obligatorias (islas de la provincia y archipiélago):
  # Tenerife, Gran Canaria, Lanzarote, Fuerteventura, La Palma, La Gomera, El Hierro
  # Valor: Cualquier código hexadecimal de color
  Tenerife: "#1B9E77"
  Gran Canaria: "#D95F02"
  Lanzarote: "#7570B3"
  Fuerteventura: "#E7298A"
  La Palma: "#66A61E"
  La Gomera: "#E6AB02"
  El Hierro: "#A6761D"

# ── Assets existentes ─────────────────────────────────────────────────────────

distribucion_lineas:
  # dataset: Nombre del archivo de renta. Por defecto "distribucion-renta-ingresos.csv"
  dataset: "distribucion-renta-ingresos.csv"
  # x_breaks: Años a mostrar marcas de graduación en el eje X.
  # Rango disponible en datos: Años entre 2015 y 2023.
  x_breaks: [2021, 2022, 2023]

mapa_distribucion:
  # dataset: Por defecto "distribucion-renta-ingresos.csv"
  dataset: "distribucion-renta-ingresos.csv"
  # ano: Año para el mapa de renta. Opciones: 2015 a 2023.
  ano: 2023
  # componente: Categoría de ingresos a analizar.
  # Opciones: "SUELDOS_SALARIOS", "PRESTACIONES_DESEMPLEO", "PENSIONES", "OTRAS_PRESTACIONES", "OTROS_INGRESOS"
  componente: "SUELDOS_SALARIOS"
  # cmap_unico: Opcional. Sobreescribe el colormap del mapa.
  # Opciones: Cualquier colormap secuencial de matplotlib (ej. "YlOrRd", "viridis", "Blues")
  # cmap_unico: "YlOrRd"

actividad_barras:
  # dataset: Por defecto "actividad-sc-3.csv"
  dataset: "actividad-sc-3.csv"
  # isla: Isla objetivo para el gráfico de barras.
  # Opciones: "Tenerife", "Gran Canaria", "La Palma", "Lanzarote", "Fuerteventura", "La Gomera", "El Hierro", o "Todas"
  isla: "Tenerife"
  # modo: Composición visual del gráfico.
  # Opciones: 
  #   "fill"  → 100% apilado (comparar proporciones relativas H/M sin volumen total)
  #   "stack" → apilado absoluto (volumen de trabajadores total con color por sexo)
  #   "dodge" → agrupado (barras separadas de hombres vs mujeres lado a lado)
  modo: "fill"

brecha_salarial:
  # datasets origen de ocupación y renta:
  dataset_ocu: "ocupacion-sc-3.csv"
  dataset_dist: "distribucion-renta-ingresos.csv"
  # top_n: Cantidad de municipios con mayor cambio absoluto en la brecha a mostrar (ej. 5, 10).
  top_n: 5
  # ano_ini / ano_fin: Periodo de comparación temporal del índice de brecha.
  # Opciones: Años entre 2021 y 2023.
  ano_ini: 2021
  ano_fin: 2023
  # ano_mapa: Año a renderizar en el mapa coroplético de brecha. Opciones: 2021 a 2023.
  ano_mapa: 2023
  # umbral: Variación del índice bajo la cual el cambio se considera neutro (gris). Por defecto 0.02.
  umbral: 0.02
  # n_anotaciones_mapa: Municipios en extremos opuestos a etiquetar con texto en el mapa (ej. 3, 5).
  n_anotaciones_mapa: 3

brecha_temporal_edad:
  # isla: Isla para el gráfico de brecha temporal.
  # Opciones: "Todas", "Tenerife", "Gran Canaria", "La Palma", "Lanzarote", "Fuerteventura", "La Gomera", "El Hierro"
  isla: "Tenerife"
  # anotar_solo_mayor: Mostrar etiquetas de texto.
  # Opciones: true (solo anota la barra más alta de cada panel), false (anota todas las barras > 4%)
  anotar_solo_mayor: true
  # ano / mes: Año y mes de contratos de la provincia.
  # Opciones de año: 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026
  # Opciones de mes: 1 a 12 (si se comenta o es null, carga el año completo)
  ano: 2026
  mes: 3

# ── Control eje Y: true = empieza en 0 / false = truncado para acentuar fluctuaciones ──

covid_sueldos_islas:
  # empezar_en_cero: true o false
  empezar_en_cero: true

covid_prestaciones_islas:
  # empezar_en_cero: true o false
  empezar_en_cero: true

gini_evolucion_islas:
  # empezar_en_cero: true o false
  empezar_en_cero: true
  # top_n_islas: Número de islas con mayor Gini a destacar en la serie.
  # Opciones: 1 a 7 (si se comenta, se calcula dinámicamente desde el último año disponible).
  # top_n_islas: 3

# ── Assets contratos históricos (toda Canarias) ───────────────────────────────

actividad_barras_canarias:
  # ano: Año de contratos a analizar. Opciones: 2019 a 2026.
  ano: 2025
  # ambito: Ámbito geográfico del filtro.
  # Opciones: "Canarias", "SC Tenerife", "Las Palmas", "Tenerife", "Gran Canaria", etc.
  ambito: "Tenerife"
  # top_n_actividades: Cantidad de sectores con más volumen a mostrar (ej. 6).
  top_n_actividades: 6

ocupacion_divergente_canarias:
  # ano: Año de contratos a analizar. Opciones: 2019 a 2026.
  ano: 2026
  # ambito: Ámbito geográfico. Opciones: "Canarias", "SC Tenerife", "Las Palmas", "Tenerife", etc.
  ambito: "SC Tenerife"
  # min_contratos: Contratos mínimos requeridos en una ocupación/isla para graficarse (ej. 100).
  min_contratos: 100
  # agregar_islas: Composición espacial.
  # Opciones: true (suma los contratos de todo el ámbito en un único panel), false (gráficos facetados por isla)
  agregar_islas: true

mapa_feminizacion_municipios:
  # ambito: Ámbito geográfico del mapa. Opciones: "Canarias", "SC Tenerife", "Las Palmas".
  ambito: "Canarias"

segregacion_sectorial:
  # top_n: Número de actividades más representativas a mostrar en el dotplot (ej. 15).
  top_n: 15
  # min_contratos: Masa crítica requerida en la celda actividad-isla para calcular ratio (ej. 15).
  min_contratos: 15
  # ano / mes: Año y mes de contratos.
  # Opciones de año de 2019 a 2026
  # Opciones de mes de 1 a 12
  ano: 2026
  mes: 3

historico_tipos_contrato:
  # ano_fin: Año de finalización de la serie temporal. Opciones: 2019 a 2026.
  ano_fin: 2026
  # mes_fin: Mes de corte para el dato del último año. Opciones: 1 a 12.
  mes_fin: 3