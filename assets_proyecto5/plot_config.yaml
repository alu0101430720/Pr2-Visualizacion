# ══════════════════════════════════════════════════════════════════════════════
# plot_config.yaml — Configuración dinámica de assets gráficos
# ══════════════════════════════════════════════════════════════════════════════

# ── Paleta global ─────────────────────────────────────────────────────────────
paleta:
  color_hombres: "#4A90D9"
  color_mujeres: "#D94A8C"
  color_brecha_favorable_hombres: "#4A90D9"
  color_brecha_favorable_mujeres: "#D94A8C"
  # cmap_brecha: si se omite, se usa el cmap azul→blanco→rosa generado en código.
  # Descomenta para forzar uno de matplotlib:
  # cmap_brecha: "RdBu_r"

# ── Assets existentes ─────────────────────────────────────────────────────────

distribucion_lineas:
  dataset: "distribucion-renta-ingresos.csv"
  x_breaks: [2021, 2022, 2023]

mapa_distribucion:
  dataset: "distribucion-renta-ingresos.csv"
  ano: 2023
  componente: "SUELDOS_SALARIOS"
  # Opciones: OTRAS_PRESTACIONES, OTROS_INGRESOS, PENSIONES,
  #           PRESTACIONES_DESEMPLEO, SUELDOS_SALARIOS
  # cmap único para todos los componentes (sobreescribe los cmaps individuales):
  # cmap_unico: "YlOrRd"

actividad_barras:
  dataset: "actividad-sc-3.csv"
  isla: "Tenerife"
  # Opciones: "Tenerife", "La Palma", "La Gomera", "El Hierro", "Todas"
  # modo: "stack"  → barras apiladas (volumen total + composición)
  #        "fill"  → 100% apilado (solo proporción H/M)
  #        "dodge" → barras agrupadas (comparar valores absolutos H vs M)
  modo: "fill"

ocupacion_divergente:
  dataset: "ocupacion-sc-3.csv"
  # ano: si se especifica, filtra ese año; si se omite, agrega todos los años
  # ano: 2023

brecha_salarial:
  dataset_ocu: "ocupacion-sc-3.csv"
  dataset_dist: "distribucion-renta-ingresos.csv"
  top_n: 5
  ano_ini: 2021
  ano_fin: 2023
  ano_mapa: 2023
  umbral: 0.02
  # n_anotaciones_mapa: municipios extremos a etiquetar directamente en el mapa
  n_anotaciones_mapa: 3

brecha_temporal_edad:
  isla: "Tenerife"
  # Opciones: "Todas", "Tenerife", "Gran Canaria", "Lanzarote",
  #           "Fuerteventura", "La Palma", "La Gomera", "El Hierro"
  # anotar_solo_mayor: true → solo etiqueta la barra más alta por panel
  anotar_solo_mayor: true

# ── Control eje Y: true = desde 0 / false = truncado con símbolo // ──────────

covid_sueldos_islas:
  empezar_en_cero: true

covid_prestaciones_islas:
  empezar_en_cero: true

gini_evolucion_islas:
  empezar_en_cero: true
  # top_n_islas: si se omite, se calcula dinámicamente desde el último año
  # top_n_islas: 3

# ── Assets contratos históricos (toda Canarias) ───────────────────────────────

actividad_barras_canarias:
  ano: 2025
  ambito: "Tenerife"
  top_n_actividades: 6

ocupacion_divergente_canarias:
  ano: 2025
  ambito: "Canarias"
  min_contratos: 100
  agregar_islas: true

mapa_feminizacion_municipios:
  ambito: "Canarias"

heatmap_segregacion:
  top_n: 15
  min_contratos: 15