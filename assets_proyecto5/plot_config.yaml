# Configuración dinámica para los Assets Gráficos
# Aquí puedes editar los años, las paletas de color y los componentes a mapear libremente.

distribucion_lineas:
  dataset: "distribucion-renta-ingresos.csv"
  x_breaks: [2021, 2022, 2023]

mapa_distribucion:
  dataset: "distribucion-renta-ingresos.csv"
  ano: 2023
  componente: "SUELDOS_SALARIOS"      # Opciones: OTRAS_PRESTACIONES, OTROS_INGRESOS, PENSIONES, PRESTACIONES_DESEMPLEO, SUELDOS_SALARIOS

actividad_barras:
  dataset: "actividad-sc-3.csv"
  isla: "Tenerife"   # Opciones: "Tenerife", "La Palma", "La Gomera", "El Hierro", o "Todas"

ocupacion_divergente:
  dataset: "ocupacion-sc-3.csv"

brecha_salarial:
  dataset_ocu: "ocupacion-sc-3.csv"
  dataset_dist: "distribucion-renta-ingresos.csv"
  top_n: 5
  ano_ini: 2021
  ano_fin: 2023
  ano_mapa: 2023
  umbral: 0.02

brecha_temporal_edad:
  isla: "Tenerife"  # Opciones: "Todas", "Tenerife", "Gran Canaria", "Lanzarote", "Fuerteventura", "La Palma", "La Gomera", "El Hierro"

# ── Nuevos assets con datos de contratos históricos ──────────────────────────
#
# ambito controla qué territorio se representa en el gráfico.
#
# Opciones para ambito:
#   "Canarias"      → todas las islas (facet por isla)
#   "SC Tenerife"   → provincia: Tenerife, La Palma, La Gomera, El Hierro
#   "Las Palmas"    → provincia: Gran Canaria, Lanzarote, Fuerteventura
#   nombre de isla  → solo esa isla, sin facet (más legible)
#     Valores válidos: "Tenerife", "Gran Canaria", "La Palma", "La Gomera",
#                      "El Hierro", "Lanzarote", "Fuerteventura"
#
# ano: año de los contratos a usar (2019-2025 o 2026 para solo marzo)

actividad_barras_canarias:
  ano: 2025
  ambito: "Canarias"      # Ver opciones arriba
  top_n_actividades: 6    # Sectores a mostrar (recomendado: 5-8)

ocupacion_divergente_canarias:
  ano: 2025
  ambito: "Canarias"      # Ver opciones arriba
  min_contratos: 100      # Excluir grupos CNO con menos de N contratos en esa isla